name: Auto Approve and Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve-merge:
    name: Approve and merge pull request
    runs-on: ubuntu-latest
    # Only run on PRs targeting main — skip draft PRs
    if: github.event.pull_request.draft == false

    steps:
      - name: Approve pull request
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash preferred, merge as fallback)
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          # Try squash first
          if gh pr merge "$PR_NUM" --auto --squash --delete-branch --repo "$REPO"; then
            echo "✅ Auto-merge (squash) enabled for PR #${PR_NUM}"
          else
            # Fall back to regular merge — squash may fail if branch protection requires it
            echo "⚠️  Squash failed — trying merge commit..."
            gh pr merge "$PR_NUM" --auto --merge --delete-branch --repo "$REPO" || \
            echo "ℹ️  Auto-merge already set or PR already merged — no action needed."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        if: always()
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          {
            echo "## 🔀 Auto Approve & Merge"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| PR | [#${PR_NUM}](https://github.com/${{ github.repository }}/pull/${PR_NUM}) |"
            echo "| Title | ${PR_TITLE} |"
            echo "| Branch | \`${{ github.head_ref }}\` → \`main\` |"
            echo ""
            echo "PR was approved and set to auto-merge (squash) into **main**."
            echo "OnSpace.ai preview will update once the merge completes."
          } >> "$GITHUB_STEP_SUMMARY"
