name: Bulletproof Last Push to OnSpace.ai

on:
  push:
    branches:
      - main
    paths:
      - '**.zip'
  pull_request:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  unzip-replace:
    name: Unzip uploaded archive and replace files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Find and unzip uploaded zip files
        id: unzip
        run: |
          set -e
          ZIP_FILES=$(find . -maxdepth 3 -name "*.zip" \
            ! -path "./.git/*" \
            ! -path "./node_modules/*")
          if [ -z "$ZIP_FILES" ]; then
            echo "No zip files found, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for ZIP in $ZIP_FILES; do
            echo "📦 Unzipping: $ZIP"
            if unzip -o "$ZIP" -d .; then
              echo "✅ Unzipped: $ZIP"
              rm -f "$ZIP"
              echo "🗑️  Removed zip: $ZIP"
            else
              echo "❌ Failed to unzip: $ZIP — zip will NOT be deleted."
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Bulletproof sync test connection to OnSpace.ai
        if: steps.unzip.outputs.changed == 'true'
        run: |
          set -e
          URL="https://onspace.ai"
          ATTEMPTS=5
          DELAY=5
          OK=0

          echo "🔎 Testing connectivity to ${URL} before final push..."
          for i in $(seq 1 $ATTEMPTS); do
            echo "Attempt ${i}/${ATTEMPTS}"
            if curl --silent --show-error --location --fail --head --connect-timeout 10 --max-time 20 "$URL" >/dev/null; then
              OK=1
              echo "✅ Connectivity check passed."
              break
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "⏳ Connectivity check failed, retrying in ${DELAY}s..."
              sleep "$DELAY"
            fi
          done

          if [ "$OK" -ne 1 ]; then
            echo "❌ Could not reach ${URL}. Blocking push to keep OnSpace.ai sync bulletproof."
            exit 1
          fi

      - name: Commit and push updated files
        if: steps.unzip.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: unzip and replace files → OnSpace.ai preview updated"

            if [ "${{ github.event_name }}" = "pull_request" ]; then
              # Push unzipped content back to the PR branch.
              # The auto-merge step below will then squash-merge it into main.
              git push origin HEAD:${{ github.head_ref }}
              echo "🔀 Unzipped content pushed to PR branch — auto-merge will apply to main."
            else
              # Push directly to main (push or workflow_dispatch event).
              git push origin HEAD:main
              echo "🚀 Changes pushed to main — OnSpace.ai preview will now reflect the new files."
            fi
          fi

      - name: Auto-merge PR if triggered by pull request
        if: steps.unzip.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --auto \
            --squash \
            --delete-branch \
            --repo ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Workflow summary
        if: always()
        run: |
          echo "## 📦 Unzip and Replace — Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Event | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.head_ref || github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Files changed | \`${{ steps.unzip.outputs.changed }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "OnSpace.ai preview updates automatically when **main** receives new commits." >> "$GITHUB_STEP_SUMMARY"
          echo "Bulletproof sync guard: connection to https://onspace.ai is tested before push." >> "$GITHUB_STEP_SUMMARY"
