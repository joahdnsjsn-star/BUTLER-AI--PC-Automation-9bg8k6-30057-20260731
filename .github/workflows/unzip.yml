name: Auto-Unzip Any Zip → Exact Repo Sync

# Replaces the ENTIRE repo with the zip contents — files not in the zip
# are deleted. The only things kept regardless: .git/ .github/ node_modules/ .env*
#
# Triggers on ANY zip pushed anywhere in the repo, plus manual dispatch.

on:
  push:
    paths:
      - "**/*.zip"
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path to zip inside the repo (leave blank = auto-detect)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  unzip-replace:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Locate the zip ──────────────────────────────────────────────────
      - name: Find zip file
        id: findzip
        run: |
          MANUAL="${{ github.event.inputs.zip_path }}"
          if [ -n "$MANUAL" ] && [ -f "$MANUAL" ]; then
            ZIP="$MANUAL"
          else
            ZIP=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
                  | grep '\.zip$' | grep -v 'node_modules' | head -n1)
            [ -z "$ZIP" ] && ZIP=$(ls *.zip 2>/dev/null | head -n1)
            [ -z "$ZIP" ] && ZIP=$(find . -name "*.zip" \
                  -not -path "*/node_modules/*" -not -path "*/.git/*" | head -n1)
          fi
          if [ -z "$ZIP" ]; then
            echo "No zip found — nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using zip: $ZIP"
          echo "zip=$ZIP"   >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      # ── 3. Extract zip ─────────────────────────────────────────────────────
      - name: Extract zip
        if: steps.findzip.outputs.found == 'true'
        run: |
          ZIP="${{ steps.findzip.outputs.zip }}"
          rm -rf /tmp/extracted && mkdir -p /tmp/extracted
          unzip -q -o "$ZIP" -d /tmp/extracted
          echo "Top-level extracted items:"
          ls -la /tmp/extracted | head -30

      # ── 4. Resolve source root (auto-unwrap single top-level folder) ───────
      - name: Resolve source root
        if: steps.findzip.outputs.found == 'true'
        id: srcroot
        run: |
          ITEMS=(/tmp/extracted/*)
          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            SRC="${ITEMS[0]}"
            echo "Unwrapped single folder: $SRC"
          else
            SRC="/tmp/extracted"
          fi
          echo "Source root: $SRC"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"

      # ── 5. EXACT SYNC: delete everything not in the zip ───────────────────
      #
      # Strategy: rsync --delete mirrors the zip contents exactly.
      # Safe zones are excluded from deletion via --filter protect rules.
      # This guarantees:
      #   • Every file in the zip → present in repo
      #   • Every file NOT in the zip → deleted from repo
      #   • .git/ .github/ node_modules/ .env* → never touched
      - name: Exact sync (delete files not in zip)
        if: steps.findzip.outputs.found == 'true'
        run: |
          SRC="${{ steps.srcroot.outputs.src }}"
          ZIP="${{ steps.findzip.outputs.zip }}"

          # Remove the zip itself from the source before syncing so it
          # doesn't get copied AND so the repo copy gets deleted too.
          ZIP_BASE=$(basename "$ZIP")
          rm -f "${SRC}/${ZIP_BASE}" 2>/dev/null || true

          echo "Running rsync exact mirror..."
          rsync -av --delete \
            --filter="protect .git/"         \
            --filter="protect .github/"      \
            --filter="protect node_modules/" \
            --filter="protect .env"          \
            --filter="protect .env.*"        \
            --filter="protect .env.local"    \
            --filter="protect .env.production" \
            "${SRC}/" "./"

          # Delete any zip files in the repo so they cannot retrigger re-apply loops
          find . -name "*.zip" \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -print -delete || true

          echo "Sync complete. Repo now mirrors zip exactly (plus safe zones)."

      # ── 6. Bump metro cache version (forces full OnSpace rebuild) ──────────
      - name: Bump metro cache version
        if: steps.findzip.outputs.found == 'true'
        run: |
          if [ -f metro.config.js ]; then
            TS=$(date +%s)
            if grep -q 'cacheVersion' metro.config.js; then
              sed -i "s/cacheVersion:.*,/cacheVersion: '${TS}',/" metro.config.js
            else
              sed -i "0,/^/{/^/a\\  cacheVersion: '${TS}'," metro.config.js
            fi
            echo "metro cacheVersion → $TS"
          fi

      # ── 7. Commit and push ─────────────────────────────────────────────────
      - name: Commit and push
        if: steps.findzip.outputs.found == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed after sync."
          else
            ZIP_NAME=$(basename "${{ steps.findzip.outputs.zip }}" .zip)
            git commit -m "chore: exact sync from ${ZIP_NAME} [skip ci] [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
            echo "Done — repo is now an exact mirror of the zip. OnSpace will rebuild."
          fi
