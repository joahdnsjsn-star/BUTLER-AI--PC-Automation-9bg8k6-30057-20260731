name: Guarded Main-Only Zip Replace for OnSpace.ai

on:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guarded-unzip-replace-main
  cancel-in-progress: false

jobs:
  unzip-replace:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Resolve zip upload
        id: zip
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "This workflow is hard-locked to main."
            exit 1
          fi

          mapfile -t ZIP_FILES < <(
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '\.zip$' || true
            else
              find . -maxdepth 3 -type f -name '*.zip' \
                ! -path './.git/*' \
                ! -path './node_modules/*' \
                -printf '%P\n'
            fi | sort -u
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "No zip uploads found, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one zip upload per run."
            printf 'Found %s zip files:\n' "${#ZIP_FILES[@]}"
            printf ' - %s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_PATH="${ZIP_FILES[0]}"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "Zip upload not found on disk: $ZIP_PATH"
            exit 1
          fi

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate zip before replacing repository
        if: steps.zip.outputs.changed == 'true'
        id: validate
        run: |
          set -euo pipefail

          ZIP_PATH="${{ steps.zip.outputs.zip_path }}"
          EXTRACT_DIR="$RUNNER_TEMP/zip-import"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -t "$ZIP_PATH"
          unzip -q "$ZIP_PATH" -d "$EXTRACT_DIR"

          CONTENT_ROOT="$EXTRACT_DIR"
          mapfile -t TOP_LEVEL < <(find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 ! -name '__MACOSX' -printf '%f\n' | sort)
          if [ "${#TOP_LEVEL[@]}" -eq 1 ] && [ -d "$EXTRACT_DIR/${TOP_LEVEL[0]}" ]; then
            CONTENT_ROOT="$EXTRACT_DIR/${TOP_LEVEL[0]}"
          fi

          if ! find "$CONTENT_ROOT" -mindepth 1 \
            ! -path '*/__MACOSX/*' \
            ! -name '__MACOSX' \
            -print -quit | grep -q .; then
            echo "Zip upload is empty after extraction. Refusing to wipe the repository."
            exit 1
          fi

          echo "content_root=$CONTENT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Create rollback tag
        if: steps.zip.outputs.changed == 'true'
        id: rollback
        run: |
          set -euo pipefail

          ROLLBACK_TAG="rollback-before-zip-replace-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$ROLLBACK_TAG"
          git push origin "$ROLLBACK_TAG"
          echo "rollback_tag=$ROLLBACK_TAG" >> "$GITHUB_OUTPUT"

      - name: Replace repository contents from validated zip
        if: steps.zip.outputs.changed == 'true'
        run: |
          set -euo pipefail

          CONTENT_ROOT="${{ steps.validate.outputs.content_root }}"
          WORKFLOW_BACKUP="$RUNNER_TEMP/unzip-replace.yml"
          SPEC_BACKUP="$RUNNER_TEMP/ONSPACE_MAIN_ONLY_SYNC_SPEC.md"

          cp .github/workflows/unzip-replace.yml "$WORKFLOW_BACKUP"
          cp ONSPACE_MAIN_ONLY_SYNC_SPEC.md "$SPEC_BACKUP"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$CONTENT_ROOT"/. .

          mkdir -p .github/workflows
          cp "$WORKFLOW_BACKUP" .github/workflows/unzip-replace.yml
          cp "$SPEC_BACKUP" ./ONSPACE_MAIN_ONLY_SYNC_SPEC.md

      - name: Commit and push replacement to main
        if: steps.zip.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "No repository changes to commit after replacement."
            exit 0
          fi

          git commit -m "auto: replace repository from validated zip upload"
          git push origin HEAD:main

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Guarded Main-Only OnSpace.ai Zip Replace"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Zip processed | \`${{ steps.zip.outputs.zip_path || 'none' }}\` |"
            echo "| Rollback tag | \`${{ steps.rollback.outputs.rollback_tag || 'not created' }}\` |"
            echo ""
            echo "OnSpace.ai automatically syncs every push to **main** once the project shows **Connected**."
          } >> "$GITHUB_STEP_SUMMARY"
