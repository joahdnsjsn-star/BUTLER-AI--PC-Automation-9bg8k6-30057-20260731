name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-privacy-policy.yml'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy full docs/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages content
        run: |
          mkdir -p _site

          # Copy ALL docs/ files to _site/
          cp -r docs/. _site/

          # Ensure index.html exists — prefer docs/index.html, fall back to privacy-policy.html
          if [ -f "_site/index.html" ]; then
            echo "✅ index.html already present (from docs/index.html)"
          elif [ -f "_site/privacy-policy.html" ]; then
            cp _site/privacy-policy.html _site/index.html
            echo "✅ Copied privacy-policy.html → index.html (fallback)"
          fi

          echo ""
          echo "📄 Files staged for deployment:"
          ls -lh _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print live URLs
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          echo "🚀 Docs are live!"
          echo ""
          echo "  Home:           ${BASE}"
          echo "  Privacy Policy: ${BASE}privacy-policy.html"
          echo ""
          echo "📋 Use the Privacy Policy URL in Play Console:"
          echo "   Play Console → Policy → App content → Privacy policy"
          echo "   → ${BASE}privacy-policy.html"
